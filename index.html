<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I Love You in 20 Languages</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts for multi-language scripts: Devanagari, Thai, Japanese, Korean, Chinese -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@700&family=Noto+Sans+JP:wght@700&family=Noto+Sans+KR:wght@700&family=Noto+Sans+SC:wght@700&family=Noto+Sans+Thai:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <main id="app">
    <div id="heart-wrapper">
      <div id="heart-container" class="heart-container" aria-label="I love you in 20 different languages arranged as a heart">
        <!-- Rendered dynamically by script.js -->
      </div>
    </div>
  </main>

  <!-- Language tooltip on hover/touch -->
  <aside id="tooltip" class="tooltip" aria-hidden="true"></aside>

  <script src="script.js"></script>
</body>
</html>
