<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>I Love You in 35 Languages ❤️</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Google Fonts: Multi-Script Unicode Coverage (Latin, Cyrillic, Greek, Arabic, Hebrew, Devanagari, Bengali, Gurmukhi, Thai, CJK) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@700&family=Noto+Sans+Arabic:wght@700&family=Noto+Sans+Bengali:wght@700&family=Noto+Sans+Devanagari:wght@700&family=Noto+Sans+Gurmukhi:wght@700&family=Noto+Sans+Hebrew:wght@700&family=Noto+Sans+JP:wght@700&family=Noto+Sans+KR:wght@700&family=Noto+Sans+SC:wght@700&family=Noto+Sans+Thai:wght@700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Main Heart Stage -->
    <div id="heart-stage" aria-label="A glowing heart formed by I love you in 35 languages">
      <div id="heart-container">
        <!-- Multilingual phrases dynamically placed by script.js -->
      </div>
    </div>

    <!-- Minimalist Replay Button -->
    <button id="replay-btn" class="replay-btn" title="Replay Animation" aria-label="Replay Animation">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
      <span>Replay</span>
    </button>

    <!-- Language Tooltip -->
    <div id="tooltip" class="tooltip" aria-hidden="true"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
